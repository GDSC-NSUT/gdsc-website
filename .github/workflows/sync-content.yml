name: Sync events & feeds
on:
  schedule:
    - cron: "30 3 * * 1" # every Monday 03:30 UTC (09:00 IST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sync events
        run: node scripts/sync-events.mjs
        continue-on-error: true
      - name: Sync feeds
        run: node scripts/sync-feeds.mjs
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/feeds.json public/events public/feeds
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly sync of events and feeds"
            git push
          fi
